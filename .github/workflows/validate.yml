name: Validate MegaVault

on:
  push:
    paths-ignore:
      - "megavault.sqlite"
      - ".github/prompt-id-request.json"
      - ".github/prompt-id-response.json"
      - ".github/prompt-id-receipts/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: megavault-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MegaVault
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py validate

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -q

      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            exit 1
          fi
