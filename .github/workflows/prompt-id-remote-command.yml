name: PROMPT_ID remote command

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: megavault-prompt-id-registry
  cancel-in-progress: false

jobs:
  command:
    if: startsWith(github.event.issue.title, '[prompt-id-command] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: master
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Capture immutable request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          Path("/tmp/prompt-id-request.json").write_text(
              str(event["issue"].get("body") or ""),
              encoding="utf-8",
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply idempotent command and persist race-safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persisted=0
          for attempt in 1 2 3; do
            git fetch --quiet origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            git clean -fd

            python3 tools/prompt_id_command.py               --request /tmp/prompt-id-request.json               > /tmp/prompt-id-output.json
            cat /tmp/prompt-id-output.json

            git add               megavault.sqlite               .github/prompt-id-response.json               .github/prompt-id-receipts

            if git diff --cached --quiet; then
              persisted=1
              break
            fi

            request_id="$(python3 -c 'import json; print(json.load(open("/tmp/prompt-id-output.json"))["request_id"])')"
            git commit -m "PROMPT_ID registry command $request_id"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              persisted=1
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to persist PROMPT_ID registry command after bounded replay on latest master" >&2
              exit 1
            fi
          done

          test "$persisted" -eq 1

      - name: Report Issue command result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/prompt-id-output.json").read_text(encoding="utf-8"))
          print(
              "PROMPT_ID={prompt_id}\nstatus={status}\nrequest_id={request_id}\nreplayed={replayed}".format(
                  **data
              )
          )
          PY
          )"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
