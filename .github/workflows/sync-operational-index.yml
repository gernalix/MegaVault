name: Sync operational indexes

on:
  push:
    paths:
      - "ai/operational_indexes.py"
      - ".github/workflows/sync-operational-index.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair stale retrieval count tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_megavault.py')
          text = path.read_text()
          old = '''        expected = {
              "codex_work_queue": 23,
              "codex_remote_projects": 4,
              "codex_missing_projects": 7,
              "codex_archived_projects": 20,
          }'''
          new = '''        expected = {
              "codex_work_queue": conn.execute("select count(*) from codex_project_index where project_status in ('LOCAL','REMOTE_ONLY')").fetchone()[0],
              "codex_remote_projects": conn.execute("select count(*) from codex_project_index where project_status='REMOTE_ONLY'").fetchone()[0],
              "codex_missing_projects": conn.execute("select count(*) from codex_project_index where project_status='MISSING'").fetchone()[0],
              "codex_archived_projects": conn.execute("select count(*) from codex_project_index where project_status='ARCHIVED'").fetchone()[0],
          }'''
          if old not in text:
              raise SystemExit('expected count block not found')
          text = text.replace(old, new, 1)
          replacements = {
              '        self.assertEqual(23, len(work_lines))': '        self.assertEqual(sqlite3.connect(ROOT / "megavault.sqlite").execute("select count(*) from codex_work_queue").fetchone()[0], len(work_lines))',
              '        self.assertEqual(4, len(remote_lines))': '        self.assertEqual(sqlite3.connect(ROOT / "megavault.sqlite").execute("select count(*) from codex_remote_projects").fetchone()[0], len(remote_lines))',
              '        self.assertEqual(7, len(missing_lines))': '        self.assertEqual(sqlite3.connect(ROOT / "megavault.sqlite").execute("select count(*) from codex_missing_projects").fetchone()[0], len(missing_lines))',
              '        self.assertEqual(20, len(archived_lines))': '        self.assertEqual(sqlite3.connect(ROOT / "megavault.sqlite").execute("select count(*) from codex_archived_projects").fetchone()[0], len(archived_lines))',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'missing test line: {before}')
              text = text.replace(before, after, 1)
          path.write_text(text)
          PY

      - name: Migrate operational indexes
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py operational-index-migrate

      - name: Validate and test
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 megavault.py operational-index-validate
          PYTHONDONTWRITEBYTECODE=1 python3 megavault.py validate
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -q

      - name: Show indexes
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 megavault.py kuma-index
          PYTHONDONTWRITEBYTECODE=1 python3 megavault.py telegram-index

      - name: Persist fixes
        shell: bash
        run: |
          git add tests/test_megavault.py megavault.sqlite
          if git diff --cached --quiet; then
            echo "No changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh MegaVault retrieval count tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
