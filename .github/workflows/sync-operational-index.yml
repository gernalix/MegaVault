name: Sync operational indexes

on:
  push:
    paths:
      - "ai/operational_indexes.py"
      - "megavault.py"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate operational indexes
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py operational-index-migrate

      - name: Show Kuma index
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py kuma-index

      - name: Show Telegram index
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py telegram-index

      - name: Show unmapped operational evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          conn = sqlite3.connect('megavault.sqlite')
          for view in ('kuma_monitor_index', 'telegram_notification_capability_index'):
              print(f'[{view}]')
              cols = [row[1] for row in conn.execute(f'pragma table_info({view})')]
              for row in conn.execute(f'select * from {view} where project_id is null'):
                  print(dict(zip(cols, row)))
          PY

      - name: Validate operational indexes
        run: PYTHONDONTWRITEBYTECODE=1 python3 megavault.py operational-index-validate

      - name: Persist updated SQLite
        shell: bash
        run: |
          git add megavault.sqlite
          if git diff --cached --quiet; then
            echo "No SQLite changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync MegaVault operational indexes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
